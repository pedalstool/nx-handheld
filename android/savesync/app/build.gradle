plugins {
    id "com.android.application"
}

android {
    namespace "com.nxredux.savesync"
    compileSdk 33

    defaultConfig {
        applicationId "com.nxredux.savesync"
        minSdk 33
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
